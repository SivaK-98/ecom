<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <!-- Materialize CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
    <!-- Google Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #1e88e5, #42a5f5);
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .btn {
            width: 100%;
            border-radius: 25px;
        }

        .signup-btn {
            margin-top: 15px;
            background-color: #4caf50;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h4 class="blue-text text-darken-2">Admin Login</h4>
        <form method="POST" action="{{ url_for('admin_login') }}">
            <div class="input-field">
                <i class="material-icons prefix">account_circle</i>
                <input type="text" id="username" name="username" required>
                <label for="username">Username</label>
            </div>
            <div class="input-field">
                <i class="material-icons prefix">lock</i>
                <input type="password" id="password" name="password" required>
                <label for="password">Password</label>
            </div>
            <button type="submit" class="btn blue darken-2 waves-effect waves-light">Login</button>
        </form>

        <!-- Signup Button -->
        <a href="{{ url_for('admin_signup') }}" class="btn signup-btn waves-effect waves-light">Sign Up</a>
    </div>

    <!-- Materialize JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script>
        M.AutoInit();
    </script>
</body>
</html>
